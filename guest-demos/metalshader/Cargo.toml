[package]
name = "metalshader"
version = "0.1.0"
edition = "2021"

[dependencies]
ash = "0.38"
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
drm = "0.14"  # new - modern DRM API
gbm = "0.18"  # new - GBM buffer management
input-linux = "0.7"  # Latest available on crates.io

[target.'cfg(target_os = "redox")'.dependencies]
# Redox-specific dependencies will go here
# orbclient or redox display APIs

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
